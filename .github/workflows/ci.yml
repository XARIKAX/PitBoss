name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  contracts:
    name: contracts — forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install solidity deps (OpenZeppelin, erc6551)
        run: npm install
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
      - name: Test (unit + invariant + fuzz)
        run: forge test -vvv
      - name: Gas report
        run: forge test --gas-report

  web:
    name: web — next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

  keeper:
    name: keeper — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
