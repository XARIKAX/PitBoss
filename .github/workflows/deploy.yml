name: Deploy

on:
  push:
    branches: [main, "claude/**"]
    paths: ["contracts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: "anvil-smoke"
        type: choice
        options: [anvil-smoke, robinhood-staging]

permissions:
  contents: write

jobs:
  # Proves the deploy script end-to-end on every contracts change: full system
  # (with mocks) onto a local anvil, deployments JSON produced and uploaded.
  anvil-smoke:
    if: github.event_name == 'push' || inputs.network == 'anvil-smoke'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Start anvil
        run: anvil --silent &
      - name: Deploy full system (mocks) to anvil
        run: |
          forge script script/Deploy.s.sol \
            --rpc-url http://127.0.0.1:8545 \
            --broadcast \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - name: Verify deployments JSON
        run: |
          test -f deployments/deployments.31337.json
          cat deployments/deployments.31337.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployments-anvil
          path: contracts/deployments/deployments.31337.json

  # Manual staging deploy to Robinhood Chain mainnet (chainId 4663) with mocked
  # oracle/router/stock (USE_MOCKS=true) so the app is playable end-to-end while
  # real integrations land. Requires repo secret DEPLOY_PRIVATE_KEY (funded with
  # a little ETH on Robinhood Chain). Commits deployments.4663.json back.
  robinhood-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.network == 'robinhood-staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy (staging, mocks) to Robinhood Chain
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          USE_MOCKS: "true"
        run: |
          if [ -z "$DEPLOY_PRIVATE_KEY" ]; then
            echo "::error::Set the DEPLOY_PRIVATE_KEY repo secret (funded on Robinhood Chain) first."
            exit 1
          fi
          forge script script/Deploy.s.sol \
            --rpc-url https://rpc.mainnet.chain.robinhood.com \
            --broadcast \
            --private-key "$DEPLOY_PRIVATE_KEY"
      - name: Commit deployments JSON
        run: |
          test -f deployments/deployments.4663.json
          cat deployments/deployments.4663.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/deployments.4663.json
          git commit -m "Deploy: record Robinhood Chain staging addresses"
          git push
