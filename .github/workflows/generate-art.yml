name: Generate Art

# Renders the 888 PitBosses via AI batch generation (painterly-pixel template
# style, plain flat backgrounds). SINGLE sequential job: this account is
# allocated one runner at a time, so matrix shards starve each other — one job
# generating 1..888 in order is the shape that actually finishes.
#
# Providers (auto-selected in art/generate-ai.mjs):
#   - FREE default: pollinations.ai (FLUX) — no secret needed, rate-limited
#     (~6.5s/image => full 888 ≈ 100 min).
#   - OPENAI_API_KEY secret set -> gpt-image-1 (~$55 for 888, tighter style control).
#   - RETRO_DIFFUSION_KEY secret set -> pixel-art-native model.
#
# The first 8 images are committed to art/samples/ early so previews land in
# the repo within minutes; the full set commits to art/collection/ at the end.
# Test with a small range first: set from/to inputs (e.g. 1..8).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First token id"
        required: true
        default: "1"
      to:
        description: "Last token id"
        required: true
        default: "888"

concurrency:
  group: generate-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: art
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build prompts
        run: node prompts.mjs

      - name: Generate first 8 (early samples)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RETRO_DIFFUSION_KEY: ${{ secrets.RETRO_DIFFUSION_KEY }}
        run: |
          FROM=${{ inputs.from }}
          TO=${{ inputs.to }}
          SAMPLE_TO=$(( FROM + 7 ))
          if [ $SAMPLE_TO -gt $TO ]; then SAMPLE_TO=$TO; fi
          node generate-ai.mjs --from $FROM --to $SAMPLE_TO

      - name: Commit early samples
        run: |
          rm -rf samples && mkdir -p samples
          cp output/images/*.png samples/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..
          git add art/samples
          git commit -m "Art: early sample previews (run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push failed (non-fatal)"

      - name: Generate remaining range
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RETRO_DIFFUSION_KEY: ${{ secrets.RETRO_DIFFUSION_KEY }}
        run: node generate-ai.mjs --from ${{ inputs.from }} --to ${{ inputs.to }}

      - name: Ingest (metadata, rarity, provenance, preview)
        run: |
          COUNT=$(ls output/images | wc -l)
          echo "images: $COUNT"
          # Partial ranges: ingest only when the full set is present.
          if [ "$COUNT" -eq 888 ]; then
            node ingest.mjs
          else
            echo "partial set — skipping full ingest"
          fi

      - name: Commit results to the repo
        run: |
          COUNT=$(ls output/images 2>/dev/null | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$COUNT" -eq 888 ]; then
            # Full collection: canonical copy in-repo (images ~31MB pixelated).
            rm -rf collection && mkdir -p collection
            cp -r output/images collection/images
            cp -r output/metadata collection/metadata
            cp output/rarity.json output/provenance.json output/preview.png collection/ 2>/dev/null || true
            cd ..
            git add art/collection
            git commit -m "Art: full 888 collection (run ${{ github.run_id }})" || echo "nothing to commit"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || echo "push failed (non-fatal)"
          elif [ "$COUNT" -gt 0 ] && [ "$COUNT" -le 16 ]; then
            rm -rf samples && mkdir -p samples
            cp output/images/*.png samples/
            cd ..
            git add art/samples
            git commit -m "Art: sample batch previews (run ${{ github.run_id }})" || echo "nothing to commit"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || echo "push failed (non-fatal)"
          else
            echo "count=$COUNT — partial set, artifact only"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pitbosses-collection
          path: |
            art/output/images
            art/output/metadata
            art/output/rarity.json
            art/output/provenance.json
            art/output/preview.png
          if-no-files-found: warn
