[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
gas_reports = ["*"]
ffi = false

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
base = "${BASE_RPC_URL}"
anvil = "http://127.0.0.1:8545"
